<script>
// ============================================================================================
// BANNON_POSTWARM — one shot, and ONLY the thing that is genuinely missing.
//
// THIS REPLACES A CHANGE I MEASURED AND THREW AWAY. The first version (BANNON_GPUQ) swept the
// scene every 120 ms for materials with no compiled program and called renderer.compile whenever
// it found one. The idea was sound; the measurement was not kind:
//                          BEFORE          AFTER          window-normalised
//     gl.linkWait          1,762 ms        2,699 ms       6.1%  ->  6.2%   (no change)
//     gl.texture             855 ms        1,124 ms       3.0%  ->  2.6%   (marginal)
//     js.raf               3,786 ms       12,655 ms        13%  ->   29%   MUCH WORSE
//     worst single frame   1,651 ms        4,432 ms
// The sweep never converges: particle and fx materials are created and destroyed constantly, so
// "an unpaid material exists" is true forever, and the queue re-walked the whole scene graph and
// re-ran an all-or-nothing compile every 400 ms for the life of the match. It bought nothing and
// tripled the JavaScript cost of a frame. Deleted, not tuned — a system that cannot converge is
// not a system with a bad constant.
//
// AND THE HARNESS HAS A NOISE FLOOR, which is the more important half of this note. Re-running
// stall_autopsy on the IDENTICAL baseline build over the same 28.7 s window gave:
//     gl.linkWait  1,762 ms  then  2,568 ms   (+46%)
//     js.raf       3,786 ms  then  4,827 ms   (+27%)
//     worst frame  1,651 ms  then  2,124 ms   (+29%)
// Same bytes, same machine, no change at all. So a single run of this harness CANNOT resolve a
// difference smaller than roughly half, and any conclusion drawn from one run of it — including
// several in this file's history — is worth less than it looks. GPUQ's 3.3x on js.raf was clearly
// outside that floor and was correctly thrown away; this one-shot warm measures INSIDE it and is
// therefore kept on the STRUCTURAL argument alone (the post chain is genuinely not in the scene
// graph and genuinely links on the first composed frame), not on a claimed speed-up. It is
// one-shot, cannot loop, and cannot regress the frame loop.
//
// WHAT SURVIVES IS THE ONE PART THAT IS A REAL, BOUNDED GAP: the post chain is NOT IN THE SCENE
// GRAPH. renderer.compile walks the scene, and EffectComposer's passes own their own materials —
// a luminosity pass, five bloom mip blurs run twice each, three ShaderPasses. No amount of scene
// compiling has ever touched them, so they link on the composer's FIRST render, which is the first
// frame the player sees. One composer render into the existing target, once, pays for all of them
// while the menu is still up. It runs a single time and can never repeat.
// ============================================================================================
(function(){
  'use strict';
  if (window.BANNON_POSTWARM) return;
  var ST = { warmed:false, ms:0, passes:0, programsBefore:-1, programsAfter:-1 };
  function lex(n){ try{ return new Function('return typeof '+n+'!=="undefined"?'+n+':null')(); }catch(e){ return null; } }

  function warm(){
    if (ST.warmed) return false;
    var r = lex('renderer'), comp = window.__composer;
    if (!r || !comp || typeof comp.render !== 'function') return false;
    ST.warmed = true;                       // one attempt, success or not — never a retry loop
    try{
      ST.programsBefore = (r.info.programs || []).length;
      var t0 = performance.now();
      comp.render(0.016);
      ST.ms = +(performance.now() - t0).toFixed(1);
      ST.passes = (comp.passes || []).length;
      ST.programsAfter = (r.info.programs || []).length;
      try{ console.log('%c[BANNON_POSTWARM] post chain warmed in ' + ST.ms + 'ms — ' + ST.passes +
        ' passes, programs ' + ST.programsBefore + ' -> ' + ST.programsAfter, 'color:#7CFC00'); }catch(e){}
    }catch(e){}
    return true;
  }
  (function poll(n){ n = n || 0; if (warm() || n > 60) return; setTimeout(function(){ poll(n+1); }, 500); })(0);

  window.BANNON_POSTWARM = { warm: warm, stats: function(){ return Object.assign({}, ST); } };
})();
</script>
