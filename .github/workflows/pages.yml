name: Deploy playable game to GitHub Pages
# The hosted PWA is the test surface for the web game. Every main revision redeploys it so
# changes cannot silently land in GitHub without refreshing the playable surface.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble PWA site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site _site/assets/icons
          cp BANNON_v150.html _site/index.html
          cp manifest.json _site/manifest.json
          cp assets/icons/icon-192.png assets/icons/icon-512.png assets/icons/apple-touch-icon.png _site/assets/icons/ || true
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          # Machine-readable provenance: the phone test surface identifies the exact main commit.
          cat > _site/runtime-version.json <<JSON
          {
            "repository": "mhvnsnt/Bannon",
            "branch": "main",
            "commit": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_ID}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "surface": "github-pages-pwa"
          }
          JSON
          # Preserve APK delivery when build artifacts exist.
          cp dist/BANNON.apk _site/BANNON.apk 2>/dev/null || true
          cp dist/BANNON-fresh.apk _site/BANNON-fresh.apk 2>/dev/null || true
          cp dist/version.json _site/version.json 2>/dev/null || true

      - name: Verify PWA payload
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/manifest.json
          test -s _site/runtime-version.json
          test -s _site/assets/icons/icon-192.png
          test -s _site/assets/icons/icon-512.png
          cmp -s BANNON_v150.html _site/index.html
          cmp -s manifest.json _site/manifest.json
          grep -q "${GITHUB_SHA}" _site/runtime-version.json
          echo "PWA_SYNC_OK ${GITHUB_SHA}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
