name: Build gate — bannon-daemon (godmode)

# Deploys happen on Render via the render.yaml Blueprint (auto-deploy on push
# to main). This workflow is the pre-merge build gate: if godmode doesn't
# compile, the PR shouldn't land. It deploys nothing itself.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  build:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godmode
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build Checks
        run: npm run build
