name: Bannon measured model repair candidates\non:\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths: ['assets/models/**', 'tools/model_diag/**', '.github/workflows/model-repair-candidates.yml']\npermissions:\n  contents: read\njobs:\n  repair:\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - { character: CIPHER, source: CIPHER.glb }\n          - { character: ECHO, source: ECHO.glb }\n          - { character: STATIC, source: STATIC.glb }\n          - { character: CODY, source: CODY_gear.glb }\n          - { character: CAIN_ELIAS, source: CAIN_ELIAS_gear.glb }\n          - { character: STICKUP, source: STICKUP.glb }\n          - { character: ONYX, source: ONYX.glb }\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n      - name: Install QA dependencies\n        run: npm install --no-save @gltf-transform/core @gltf-transform/extensions meshoptimizer playwright@1.56.1 && npx playwright install --with-deps chromium\n      - name: Verify inputs\n        run: test -s assets/models/BANNON_rigged.glb && test -s assets/models/${{ matrix.source }}\n      - name: Build non-destructive repair candidate\n        run: node tools/model_diag/transfer_weights.cjs assets/models/BANNON_rigged.glb assets/models/${{ matrix.source }} assets/models/${{ matrix.character }}_rig28_candidate.glb\n      - name: Measure skinning and spike risk\n        run: |\n          node tools/model_diag/skinqa.cjs assets/models/${{ matrix.character }}_rig28_candidate.glb | tee qa.txt\n          node tools/model_diag/spikes.cjs --gate assets/models/${{ matrix.character }}_rig28_candidate.glb | tee -a qa.txt\n      - name: Archive measured candidate\n        uses: actions/upload-artifact@v4\n        with:\n          name: Bannon-model-repair-${{ matrix.character }}\n          path: |\n            assets/models/${{ matrix.character }}_rig28_candidate.glb\n            qa.txt\n          retention-days: 14