[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-emulator-lab"
version = "0.1.0"
description = "Local-first catalog and safe intake for authorized game files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["watchdog>=4.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.5"]

[project.scripts]
game-emulator-watch = "game_emulator.watcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
